<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Calendar Mock — Month View</title>
<style>
  :root{--bg:#fff;--muted:#8e8e93;--accent:#0A84FF;--surface:#F7F7F8}
  body{font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui; background:var(--bg); color:#0c0c0c; margin:24px;}
  .month{display:grid; grid-template-columns:repeat(7,1fr); gap:8px; max-width:720px;}
  .cell{background:var(--surface); padding:12px; border-radius:8px; min-height:80px;}
  .today{outline:2px solid var(--accent); border-radius:8px;}
  .event{background:#fff; padding:6px 8px; margin-top:8px; border-radius:6px; box-shadow:0 1px 2px rgba(0,0,0,0.04); font-size:14px;}
</style>
</head>
<body>
<h1>April</h1>
<div class="month">
  <!-- 7x5 cells -->
  <div class="cell">29</div><div class="cell">30</div>
  <div class="cell">31</div><div class="cell today">1<div class="event"><strong>Team sync</strong><div style="color:var(--muted);font-size:12px">10:00 AM</div></div></div>
  <div class="cell">2</div><div class="cell">3</div><div class="cell">4</div>
  <!-- more cells omitted for brevity -->
</div>
</body>
</html>
